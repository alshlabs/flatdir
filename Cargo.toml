[package]
name = "flatdir"
version = "0.1.0"
edition = "2024"

[lints.rust]
elided_lifetimes_in_paths = "allow"
rust_2018_idioms = { priority = -1, level = "deny" }

[lints.clippy]
module_inception = "allow"
uninlined_format_args = "allow"

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
normalize-path = "0.2.1"
walkdir = "2.5.0"
anyhow = "1.0.100"
pathdiff = "0.2.3"
slugify = "0.1.0"

[profile.release]
opt-level = 3
debug = false
lto = true
strip = "debuginfo"
panic = 'unwind'
incremental = false
codegen-units = 1
rpath = false
